<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Spotted. social post</title>
<!-- Renders one 1080x1350 post image for Instagram and LinkedIn. Not part of the extension.
     post.html?type=pick&date=2026-11-24   (the day's Spotted ad)
     post.html?type=guru&date=2026-11-24   (that day's Guru says quote)
     post.html?type=league&date=2026-11-27 (the league table top 5)
     Open it through a local server (social/make_post.py does this for you). -->
<style>
  :root { --red:#E24B4A; --red-dark:#A32D2D; --red-light:#FCEBEB; --ink:#2C2C2A; --muted:#5F5E5A; --line:#D3D1C7;
    --sticker:#FAC775; --sticker-ink:#412402; --yellow:#FFD500;
    --headline: Anton, Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    --body: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: var(--red); font-family: var(--body); color: var(--ink);
    display: flex; flex-direction: column; padding: 64px 72px 56px; }
  .mast { display: flex; align-items: center; justify-content: space-between; color: #fff; }
  .logo { display: flex; align-items: center; gap: 18px; }
  .logo img { width: 92px; height: 92px; }
  .logo span { font-family: var(--headline); font-size: 76px; letter-spacing: 1px; }
  .meta { font-size: 28px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--red-light); }
  .card { flex: 1; margin-top: 44px; background: #fff; border-radius: 28px; padding: 64px 64px 56px; display: flex; flex-direction: column;
    box-shadow: 0 18px 40px rgba(0,0,0,.22); }
  .label { margin: 0 0 18px; font-size: 30px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--red-dark); }
  .brand { font-family: var(--headline); font-weight: 400; font-size: 150px; line-height: .95; margin: 0 0 18px; overflow-wrap: anywhere; }
  .brand.long { font-size: 110px; }
  .agency { font-size: 40px; font-weight: 700; margin: 0 0 44px; }
  .agency .by { font-weight: 400; color: var(--muted); }
  .row-label { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .campaign { font-family: var(--headline); font-size: 64px; line-height: 1.05; margin: 0 0 22px; }
  .sticker { align-self: flex-start; background: var(--sticker); color: var(--sticker-ink); font-weight: 800; font-size: 28px;
    padding: 10px 20px; border-radius: 10px; transform: rotate(-2deg); }
  .blurb { font-size: 38px; line-height: 1.35; margin: auto 0 0; padding-top: 36px; border-top: 3px solid var(--line); }
  .quote { font-family: var(--headline); font-size: 84px; line-height: 1.08; margin: auto 0; }
  .quote.long { font-size: 64px; }
  .person { font-size: 40px; font-weight: 700; margin: 0; }
  .note { font-size: 28px; color: var(--muted); margin: 8px 0 0; }
  ol { list-style: none; margin: 10px 0 0; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; border-bottom: 3px solid var(--line); font-size: 38px; font-weight: 700; }
  li .who { display: flex; align-items: center; gap: 22px; }
  li .rank { width: 70px; text-align: center; }
  li small { display: block; font-size: 22px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--red-dark); }
  li.p1 { font-size: 50px; } li.p1 .rank { font-size: 64px; }
  li .pts { font-family: var(--headline); font-weight: 400; font-size: 52px; color: var(--red-dark); }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 36px; color: #fff; font-size: 30px; font-weight: 700; }
  .foot .dot { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); margin-right: 12px; vertical-align: -2px; }
</style>
</head>
<body>
  <header class="mast">
    <div class="logo"><img src="../icons/gull-512.png" alt=""><span>Spotted.</span></div>
    <div class="meta" id="meta"></div>
  </header>
  <main class="card" id="card"></main>
  <footer class="foot"><span><span class="dot"></span>A dope new ad every weekday</span><span>Get the Chrome plugin</span></footer>
  <script type="module">
    import { pickToday, issueNumber, streetCred, weekday, daysBetween, niceDate } from '../lib/data.js';
    const q = new URLSearchParams(location.search);
    const type = q.get('type') || 'pick';
    const date = q.get('date');
    const get = (f) => fetch('../data/' + f).then((r) => r.json());
    const card = document.getElementById('card');
    const meta = document.getElementById('meta');
    function el(tag, cls, ...kids) {
      const n = document.createElement(tag); if (cls) n.className = cls;
      for (const k of kids) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
      return n;
    }
    const [spotlights, quotes, league] = await Promise.all([get('spotlights.json'), get('quotes.json'), get('league.json')]);
    const spots = spotlights.spotlights;

    if (type === 'pick') {
      const s = spots.find((x) => x.featureDate === date) || pickToday(spots, date);
      if (!s) throw new Error('No pick for ' + date);
      meta.textContent = 'No. ' + String(issueNumber(spots, s)).padStart(3, '0');
      const label = s.throwback ? `Throwback ${weekday(s.featureDate)}` : `Spotted ${s.format || 'ad'}`;
      card.append(...[
        el('p', 'label', label + (s.throwback && s.format && s.format !== 'ad' ? ' · ' + s.format : '')),
        el('h1', 'brand' + (s.brand.length > 11 ? ' long' : ''), s.brand),
        el('p', 'agency', el('span', 'by', 'by '), s.agency),
        el('p', 'row-label', 'Campaign'),
        el('p', 'campaign', `“${s.campaign}”`),
        s.award ? el('span', 'sticker', [s.award.prize, s.award.show].filter(Boolean).join(' · ')) : null,
        el('p', 'blurb', s.blurb),
      ].filter(Boolean));
    } else if (type === 'guru') {
      const list = quotes.quotes;
      const i = q.has('quote') ? Number(q.get('quote')) : ((daysBetween('2026-01-01', date) % list.length) + list.length) % list.length;
      const x = list[i];
      meta.textContent = niceDate(date);
      card.append(...[
        el('p', 'label', 'Guru says'),
        el('p', 'quote' + (x.text.length > 110 ? ' long' : ''), `“${x.text}”`),
        el('p', 'person', x.person),
        el('p', 'note', 'Your daily dose of wisdom.'),
      ].filter(Boolean));
    } else if (type === 'league') {
      const rows = streetCred(league, spots, date).slice(0, 5);
      const medal = { 1: ['🏆', 'King of all agencies'], 2: ['🥈', 'First loser'], 3: ['🥄', 'Wooden spoon'] };
      meta.textContent = '2K26 season';
      card.append(...[
        el('p', 'label', 'Spotted League Table'),
        el('p', 'agency', 'Which agencies are winning all the shiny things? Nobody cares. But we care.'),
        el('ol', null, ...rows.map((r, idx) => {
          const m = medal[idx + 1];
          return el('li', idx === 0 ? 'p1' : null,
            el('span', 'who', el('span', 'rank', m ? m[0] : `${idx + 1}.`), el('span', null, r.name, m ? el('small', null, m[1]) : null)),
            el('span', 'pts', r.cred));
        })),
      ].filter(Boolean));
    }
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
