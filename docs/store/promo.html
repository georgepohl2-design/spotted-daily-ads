<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Spotted. promo tile</title>
<!-- Renders the Chrome Web Store small promo tile (440x280). Not part of the extension. -->
<style>
  html, body { margin: 0; }
  body { width: 440px; height: 280px; overflow: hidden; background: #E24B4A; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; gap: 6px; padding: 0 22px 0 8px; box-sizing: border-box; }
  img { width: 190px; height: 190px; flex: none; }
  .name { font-family: Anton, Impact, sans-serif; font-size: 54px; line-height: 1; letter-spacing: .5px; }
  .beta { display: inline-block; margin: 10px 0 12px; font-size: 13px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; border: 2px solid #fff; border-radius: 99px; padding: 2px 10px; }
  .line { font-size: 17px; line-height: 1.3; font-weight: 600; color: #FCEBEB; }
</style>
</head>
<body>
  <img src="../../icons/gull.svg" alt="">
  <div>
    <div class="name">Spotted.</div>
    <span class="beta">Beta</span>
    <div class="line">A dope new ad campaign, every weekday at midday.</div>
  </div>
</body>
</html>
